services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: session_it
      MYSQL_DATABASE: session_it
    ports:
      - "${SESSION_IT_MYSQL_PORT:-13316}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=session_it mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: session_it
      POSTGRES_DB: session_it
    ports:
      - "${SESSION_IT_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d session_it"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${SESSION_IT_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
