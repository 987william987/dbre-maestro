services:
  mysql80-source:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: online_ddl_it
      MYSQL_ROOT_HOST: "%"
    command:
      - --server-id=8101
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    ports:
      - "${ONLINE_DDL_IT_MYSQL_PORT:-13320}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=online_ddl_it mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 2s
      timeout: 2s
      retries: 40

  mysql80-replica:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: online_ddl_it
      MYSQL_ROOT_HOST: "%"
    command:
      - --server-id=8102
      - --relay-log=relay-bin
      - --log-bin=mysql-bin
      - --log-replica-updates=ON
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --read-only=ON
      - --report-host=mysql80-replica
      - --report-port=3306
    ports:
      - "${ONLINE_DDL_IT_REPLICA_PORT:-13321}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=online_ddl_it mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 2s
      timeout: 2s
      retries: 40

  online-ddl-test:
    build:
      context: ../../
      dockerfile: Dockerfile
      target: online-ddl-integration
    environment:
      ONLINE_DDL_INTEGRATION: "1"
      ONLINE_DDL_IT_HOST: mysql80-source
      ONLINE_DDL_IT_PORT: "3306"
      ONLINE_DDL_IT_PASSWORD: online_ddl_it
    depends_on:
      mysql80-source:
        condition: service_healthy
      mysql80-replica:
        condition: service_healthy
