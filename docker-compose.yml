services:
  mysql:
    image: mysql:8.0
    container_name: maestro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: maestro
      MYSQL_USER: maestro_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-changeme_app}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u maestro_app -p$${MYSQL_APP_PASSWORD:-changeme_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maestro-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DSN: "maestro_app:${MYSQL_APP_PASSWORD:-changeme_app}@tcp(mysql:3306)/maestro?parseTime=true&charset=utf8mb4&loc=UTC"
      MIGRATION_DSN: "root:${MYSQL_ROOT_PASSWORD:-changeme_root}@tcp(mysql:3306)/maestro?parseTime=true&charset=utf8mb4&loc=UTC"
      DBRE_ENCRYPTION_KEY: ${DBRE_ENCRYPTION_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      MFA_ENFORCEMENT: ${MFA_ENFORCEMENT:-}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      AWS_SM_ENABLE: ${AWS_SM_ENABLE:-false}
      AWS_SM_REGION: ${AWS_SM_REGION:-}
      AWS_SM_SECRET_ID: ${AWS_SM_SECRET_ID:-}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SDK_LOAD_CONFIG: "1"
      DB_CONNECTION_HOST_POLICY_ENFORCEMENT: ${DB_CONNECTION_HOST_POLICY_ENFORCEMENT:-off}
      DB_CONNECTION_HOST_ALLOWLIST: ${DB_CONNECTION_HOST_ALLOWLIST:-}
      DB_CONNECTION_CIDR_ALLOWLIST: ${DB_CONNECTION_CIDR_ALLOWLIST:-}
      DB_CONNECTION_CIDR_DENYLIST: ${DB_CONNECTION_CIDR_DENYLIST:-}
      LARK_WEBHOOK_URL: ${LARK_WEBHOOK_URL:-}
      LARK_OAUTH_ENABLE: ${LARK_OAUTH_ENABLE:-false}
      LARK_SITE: ${LARK_SITE:-lark}
      LARK_APP_ID: ${LARK_APP_ID:-}
      LARK_APP_SECRET: ${LARK_APP_SECRET:-}
      LARK_OAUTH_REDIRECT_URL: ${LARK_OAUTH_REDIRECT_URL:-}
      LARK_OAUTH_SCOPES: ${LARK_OAUTH_SCOPES:-directory:employee.base.enterprise_email:read}
      LARK_OAUTH_REQUIRE_ENTERPRISE_EMAIL: ${LARK_OAUTH_REQUIRE_ENTERPRISE_EMAIL:-true}
      LARK_OAUTH_ENTERPRISE_EMAIL_DOMAINS: ${LARK_OAUTH_ENTERPRISE_EMAIL_DOMAINS:-}
      SSO_OIDC_ENABLED: ${SSO_OIDC_ENABLED:-false}
      SSO_OIDC_DISPLAY_NAME: ${SSO_OIDC_DISPLAY_NAME:-Authentik}
      SSO_OIDC_ISSUER_URL: ${SSO_OIDC_ISSUER_URL:-}
      SSO_OIDC_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:-}
      SSO_OIDC_CLIENT_SECRET: ${SSO_OIDC_CLIENT_SECRET:-}
      SSO_OIDC_REDIRECT_URL: ${SSO_OIDC_REDIRECT_URL:-}
      SSO_OIDC_SCOPES: ${SSO_OIDC_SCOPES:-openid,profile,email,dbre}
      SSO_OIDC_TRUST_MFA: ${SSO_OIDC_TRUST_MFA:-false}
      SSO_OIDC_REQUIRE_ENTERPRISE_EMAIL: ${SSO_OIDC_REQUIRE_ENTERPRISE_EMAIL:-true}
      SSO_OIDC_ENTERPRISE_EMAIL_DOMAINS: ${SSO_OIDC_ENTERPRISE_EMAIL_DOMAINS:-}
      DB_POOL_QUERY_MAX_OPEN: ${DB_POOL_QUERY_MAX_OPEN:-10}
      DB_POOL_QUERY_MAX_IDLE: ${DB_POOL_QUERY_MAX_IDLE:-5}
      DB_POOL_QUERY_CONN_MAX_LIFETIME: ${DB_POOL_QUERY_CONN_MAX_LIFETIME:-5m}
      DB_POOL_QUERY_CONN_MAX_IDLE_TIME: ${DB_POOL_QUERY_CONN_MAX_IDLE_TIME:-2m}
      DB_POOL_EXEC_MAX_OPEN: ${DB_POOL_EXEC_MAX_OPEN:-3}
      DB_POOL_EXEC_MAX_IDLE: ${DB_POOL_EXEC_MAX_IDLE:-1}
      DB_POOL_EXEC_CONN_MAX_LIFETIME: ${DB_POOL_EXEC_CONN_MAX_LIFETIME:-5m}
      DB_POOL_EXEC_CONN_MAX_IDLE_TIME: ${DB_POOL_EXEC_CONN_MAX_IDLE_TIME:-2m}
      DB_POOL_METADATA_MAX_OPEN: ${DB_POOL_METADATA_MAX_OPEN:-1}
      DB_POOL_METADATA_MAX_IDLE: ${DB_POOL_METADATA_MAX_IDLE:-1}
      DB_POOL_METADATA_CONN_MAX_LIFETIME: ${DB_POOL_METADATA_CONN_MAX_LIFETIME:-2m}
      DB_POOL_METADATA_CONN_MAX_IDLE_TIME: ${DB_POOL_METADATA_CONN_MAX_IDLE_TIME:-1m}
      DB_POOL_SCOPED_PG_QUERY_MAX_OPEN: ${DB_POOL_SCOPED_PG_QUERY_MAX_OPEN:-2}
      DB_POOL_SCOPED_PG_QUERY_MAX_IDLE: ${DB_POOL_SCOPED_PG_QUERY_MAX_IDLE:-1}
      DB_POOL_SCOPED_PG_QUERY_CONN_MAX_LIFETIME: ${DB_POOL_SCOPED_PG_QUERY_CONN_MAX_LIFETIME:-2m}
      DB_POOL_SCOPED_PG_QUERY_CONN_MAX_IDLE_TIME: ${DB_POOL_SCOPED_PG_QUERY_CONN_MAX_IDLE_TIME:-1m}
      DB_POOL_SHADOW_VALIDATION_MAX_OPEN: ${DB_POOL_SHADOW_VALIDATION_MAX_OPEN:-1}
      DB_POOL_SHADOW_VALIDATION_MAX_IDLE: ${DB_POOL_SHADOW_VALIDATION_MAX_IDLE:-1}
      DB_POOL_SHADOW_VALIDATION_CONN_MAX_LIFETIME: ${DB_POOL_SHADOW_VALIDATION_CONN_MAX_LIFETIME:-2m}
      DB_POOL_SHADOW_VALIDATION_CONN_MAX_IDLE_TIME: ${DB_POOL_SHADOW_VALIDATION_CONN_MAX_IDLE_TIME:-1m}
    ports:
      - "8080:8080"
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maestro-frontend
    depends_on:
      app:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: "http://app:8080"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  mysql_data:
  frontend_node_modules:
