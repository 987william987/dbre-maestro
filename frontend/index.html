<!DOCTYPE html>
<html lang="zh-TW" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBRE Maestro</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const storedMode = localStorage.getItem('dbre-theme-mode')
          const mode = ['light', 'dark', 'system'].includes(storedMode) ? storedMode : 'system'
          const storedPreset = localStorage.getItem('dbre-theme-preset')
          const preset = ['default', 'ocean', 'forest', 'amber', 'amethyst'].includes(storedPreset) ? storedPreset : 'default'
          const isDark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.dataset.theme = preset
        } catch {
          // The application provider applies the default when storage is unavailable.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
